name: Collect Metrics

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:      # Manual trigger
  push:
    branches: [main]      # Run on push to main

permissions:
  contents: write  # Needed to push to data branch

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (main branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MWMBL_API_KEY: ${{ secrets.MWMBL_API_KEY }}
          MWMBL_API_URL: ${{ secrets.MWMBL_API_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run collect

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      
      - name: Commit and push to data branch
        run: |
          # Save generated metrics
          cp metrics.json /tmp/metrics.json

          # Return the branch to a clean state
          rm metrics.json

          # Fetch latest remote data branch
          git fetch origin data

          # Switch to data branch
          git checkout data

          # Update local data branch from remote
          git pull --ff-only origin data

          # Restore generated metrics
          cp /tmp/metrics.json metrics.json

          # Commit and push
          git add metrics.json
          git commit -m "Update metrics: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push origin data
